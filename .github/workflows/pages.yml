# Keeps Setu up to date by itself and publishes it on GitHub Pages. Nothing here needs a person or a particular computer.
#
#   Every morning (09:00 India time):
#     • checks every official source; a change still there the next morning is published as an alert, quoted word
#       for word (scripts/watch-sources.ts --publish, scripts/auto-alerts.ts)
#     • re-checks every fact against its source; a fact whose source changed shows a warning at once
#     • fresh exchange rate (ECB)
#   Every Sunday, additionally:
#     • re-downloads the DAAD course database (deadline, fee and requirement changes appear in My plan)
#     • re-reads every course's page on the university's own website (My plan → "Check university pages")
#     • fills in missing city guides
#   Then the results are saved in the repository (data/) and the site is rebuilt, so every phone and computer gets
#   them the next time Setu is opened. Also runs on every push to main, and by hand (Actions → Run workflow).
#
# Safety: the data checks (npm run test:data) must pass before anything is saved. If the weekly refresh produces
# data that fails them, it is thrown away and the site keeps last week's data; the daily part is published anyway.
name: Update data and deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: "30 3 * * *" # 09:00 in India
  workflow_dispatch:
    inputs:
      weekly:
        description: "Also run the weekly refresh now (DAAD courses, university pages, city guides — about an hour)"
        type: boolean
        default: false
      rebaseline:
        description: "Only re-take the snapshots of the official pages, without publishing alerts (after adding sources)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

env:
  # Sent in the User-Agent of every request, so the official sites can see who is reading and how to reach us.
  SETU_CONTACT: ${{ github.server_url }}/${{ github.repository }}

jobs:
  update:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 200
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # npm install, not npm ci: the lock file is written on Windows and lacks Linux-only optional packages.
      - run: npm install --no-audit --no-fund
      - name: Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Official sources (daily)
        run: |
          if [ "${{ inputs.rebaseline }}" = "true" ]; then
            npm run alerts:watch -- --no-ai --rebaseline
          else
            npm run alerts:watch -- --no-ai --publish
          fi
      - name: Facts (daily)
        # Exit 1 = a fact's source changed (the fact now shows a warning), 3 = a source was unreachable. Neither stops the update.
        run: npm run check:facts || echo "::warning::check:facts reported problems — see data/fact-check-report.json"
      - name: Save daily results
        run: |
          npm run test:data
          git add data
          if git diff --cached --quiet; then echo "nothing new"; exit 0; fi
          git commit -q -m "Daily update $(date -u +%F): official sources and facts"
          for i in 1 2 3; do git push && exit 0; git pull --rebase -q; done; exit 1

      - name: Weekly refresh
        id: weekly
        if: inputs.weekly || github.event_name == 'schedule'
        continue-on-error: true
        run: |
          if [ "${{ inputs.weekly }}" != "true" ] && [ "$(date -u +%u)" != "7" ]; then echo "not Sunday"; exit 0; fi
          set -e
          npm run data:programmes -- --refresh
          npm run data:map
          npm run data:build
          npm run data:unipages
          npm run data:cities -- --max-new 20 || echo "::warning::some city guides could not be downloaded (OpenStreetMap busy); next week fills them in"
          if ! npm run test:data; then
            git checkout -- data && git clean -fdq data
            echo "::error::The weekly data failed the safety checks and was NOT published; the site keeps last week's data."
            exit 1
          fi
          git add data
          if git diff --cached --quiet; then echo "nothing new"; exit 0; fi
          git commit -q -m "Weekly update $(date -u +%F): DAAD courses, university pages, city guides"
          for i in 1 2 3; do git push && exit 0; git pull --rebase -q; done; exit 1

  build:
    needs: update
    if: ${{ !cancelled() && needs.update.result != 'failure' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main # includes the data the update job just saved
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm install --no-audit --no-fund
      - id: pages
        uses: actions/configure-pages@v5
      - name: Checks
        run: |
          npx next typegen
          npx tsc --noEmit
          npm run lint
          npm run test:data
          npm run test:storage
          npm run test:search
          npm run test:intake
          npm run test:sw
          npm run test:unipages
      - name: Build static site
        run: npm run build:static
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          NEXT_PUBLIC_REPO_URL: ${{ github.server_url }}/${{ github.repository }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
